name: Host validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate extraction tool without game data
        run: python3 -m unittest discover -s tests -p 'test_tools.py' -v
      - name: Audit portability and backend structure
        run: |
          python3 tools/audit_portability.py
          python3 tools/check_md_backend.py
          make test-md-video
      - name: Validate ROM-free SMS sprite status
        run: make test-video-status test-video-status-sanitize
      - name: Validate ROM-free VDP block transfers
        run: make test-video-block test-video-block-sanitize
      - name: Check C syntax without game data
        # Empty initializer is for syntax checking only. Never execute/link a
        # game against placeholder data or report a behavioral test as passed.
        run: |
          trap 'rm -f src/original_rom.inc' EXIT
          : > src/original_rom.inc
          cc -std=c11 -Wall -Wextra -Werror -Isrc/include -fsyntax-only src/*.c
          cc -std=c11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -Isrc/include -Imd/include -fsyntax-only md/src/*.c
      - name: Restore private reference input
        id: reference
        if: github.event_name != 'pull_request'
        env:
          GAW_ROM_BASE64: ${{ secrets.GAW_ROM_BASE64 }}
        run: |
          if [ -z "$GAW_ROM_BASE64" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Reference-ROM tests skipped: GAW_ROM_BASE64 has not been configured.'
            exit 0
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path('reference.sms').write_bytes(base64.b64decode(os.environ['GAW_ROM_BASE64'], validate=True))
          PY
          make prepare-rom ROM=reference.sms
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Run reference-ROM differential tests
        if: steps.reference.outputs.available == 'true'
        run: |
          make test test-final test-reset test-ui test-effects test-assets test-video test-pause test-scene test-full-effects test-transitions test-entry test-map-resources test-game-over test-presentation test-inventory test-menu test-services test-ending test-intro test-audio test-irq test-player-items test-world-scroll test-native-boot audit test-sanitize
  native-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM-free production 68000 video fixture
        run: |
          sh md/fetch_toolchain.sh "$PWD/md/toolchain"
          PREFIX="$PWD/md/toolchain/bin/m68k-elf-" sh tools/build_md_video_fixture.sh
      - name: Build pinned Genesis Plus GX core
        run: |
          git init md/build/genesis-plus-gx
          git -C md/build/genesis-plus-gx remote add origin https://github.com/libretro/Genesis-Plus-GX.git
          git -C md/build/genesis-plus-gx fetch --depth=1 origin 49c584764893b0505ac7f768a754f97330fa4392
          git -C md/build/genesis-plus-gx checkout --detach FETCH_HEAD
          make -C md/build/genesis-plus-gx -f Makefile.libretro HAVE_CHD=0 -j2
      - name: Compare native video pixels to independent indexed oracle
        run: |
          python3 tools/test_md_video_emulator.py --core md/build/genesis-plus-gx/genesis_plus_gx_libretro.so --nm md/toolchain/bin/m68k-elf-nm
      - name: Validate wrapped sprite collisions on independent SMS hardware core
        run: python3 tools/test_sms_sprite_emulator.py --core md/build/genesis-plus-gx/genesis_plus_gx_libretro.so
