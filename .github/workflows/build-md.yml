name: Build Mega Drive ROM
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified private reference ROM
        env:
          GAW_ROM_BASE64: ${{ secrets.GAW_ROM_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('GAW_ROM_BASE64', '')
          if not value:
              raise SystemExit('Set GAW_ROM_BASE64 before building: see README.md')
          Path('reference.sms').write_bytes(base64.b64decode(value, validate=True))
          PY
          make prepare-rom ROM=reference.sms
      - name: Fetch 68000 toolchain and build
        run: FETCH_TOOLCHAIN=1 ./md/build_md.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gaw-megadrive-rom
          path: |
            md/build/gaw_md.bin
            md/build/gaw_md.map
