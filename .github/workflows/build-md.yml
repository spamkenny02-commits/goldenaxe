name: Build Mega Drive ROM
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'md/**'
      - 'tools/check_md_rom.py'
      - '.github/workflows/build-md.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 68000 toolchain and build
        run: FETCH_TOOLCHAIN=1 ./md/build_md.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gaw-megadrive-rom
          path: |
            md/build/gaw_md.bin
            md/build/gaw_md.map
