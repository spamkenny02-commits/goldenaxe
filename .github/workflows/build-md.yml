name: Build Mega Drive ROM
on:
  workflow_dispatch:

# Push-triggered builds will be enabled once the initial V12 source import is complete.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 68000 toolchain and build
        run: FETCH_TOOLCHAIN=1 ./md/build_md.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gaw-megadrive-rom
          path: |
            md/build/gaw_md.bin
            md/build/gaw_md.map
